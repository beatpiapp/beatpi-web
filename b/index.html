<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>beatPi · Un beat para ti</title>
<meta name="description" content="Un beat hecho con beatPi, la app para crear beats dibujando. Ábrelo en la app.">
<meta name="robots" content="noindex">
<meta property="og:title" content="Un beat hecho con beatPi">
<meta property="og:description" content="Crea beats dibujando. Toca para abrirlo en la app.">
<meta property="og:image" content="https://beatpiapp.github.io/beatpi-web/b/preview.png">
<meta property="og:type" content="website">
<meta name="theme-color" content="#181D29">
<!--
  Page for shared beats: https://beatpiapp.github.io/beatpi-web/b/#<code>
  The beat travels after the "#", which the browser never sends to the server, so nobody
  but the person with the link sees it. This page loads nothing from anywhere else.
  The code is the beat's JSON, compressed with raw deflate and written in URL-safe Base64
  (ShareCode.kt in the app). The board is drawn like Board.kt draws it, without sound.
-->
<style>
  :root { --bg: #181D29; --glow: #232B3E; --surface: #1F2635; --surface2: #2A3246; --line: #363F56;
          --fg: #E8ECF5; --muted: #8F98B0; --amber: #F2A65E; --cyan: #7FE3F0; --on-accent: #10202A; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: radial-gradient(ellipse at 50% 28%, var(--glow), var(--bg) 70%) var(--bg) fixed;
         color: var(--fg); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         display: flex; justify-content: center; padding: 20px 16px 32px; }
  main { width: 100%; max-width: 440px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .logo { font-weight: 800; font-size: 26px; letter-spacing: -0.5px; margin: 0; }
  .logo span { color: var(--amber); }
  h1 { font-size: 22px; margin: 4px 0 0; text-align: center; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font: 14px ui-monospace, "DM Mono", Menlo, monospace; text-align: center; }
  canvas { width: min(100%, 400px); aspect-ratio: 1; display: block; }
  .buttons { width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  a.button { display: block; text-align: center; text-decoration: none; font-weight: 600; font-size: 16px;
             border-radius: 999px; padding: 14px 18px; }
  a.primary { background: var(--cyan); color: var(--on-accent); }
  a.secondary { border: 1px solid var(--line); color: var(--fg); }
  p.note { color: var(--muted); font-size: 13px; text-align: center; margin: 4px 0 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <p class="logo">beat<span>π</span></p>
  <h1 id="title"></h1>
  <div class="meta" id="meta"></div>
  <canvas id="board" width="800" height="800" aria-label=""></canvas>
  <div class="buttons">
    <a class="button primary" id="open" hidden></a>
    <a class="button secondary" id="store" href="https://play.google.com/store/apps/details?id=com.beatpi.app"></a>
  </div>
  <p class="note" id="note"></p>
</main>
<script>
"use strict";
const es = (navigator.language || "en").toLowerCase().startsWith("es");
const T = es ? {
  title: "Un beat hecho con beatPi", untitled: "Un beat para ti", open: "Abrir en beatPi",
  store: "Descargar beatPi en Google Play", hits: n => n === 1 ? "1 golpe" : n + " golpes",
  note: "beatPi es una app para Android que crea beats dibujando. Cada punto es un golpe; cuando la barra pasa por él, suena.",
  bad: "Este enlace no tiene ningún beat", badNote: "Puede que se haya cortado al copiarlo.",
  board: "Dibujo del beat",
  listen: "Para oírlo, ábrelo en beatPi.",
  elsewhere: "Para oírlo, abre este enlace en un móvil o tablet Android con beatPi.",
} : {
  title: "A beat made with beatPi", untitled: "A beat for you", open: "Open in beatPi",
  store: "Get beatPi on Google Play", hits: n => n === 1 ? "1 hit" : n + " hits",
  note: "beatPi is an Android app for making beats by drawing. Every dot is a hit; when the bar passes it, it plays.",
  bad: "This link has no beat in it", badNote: "It may have been cut off when it was copied.",
  board: "The beat's drawing",
  listen: "To hear it, open it in beatPi.",
  elsewhere: "To hear it, open this link on an Android phone or tablet with beatPi.",
};
document.documentElement.lang = es ? "es" : "en";
const PACKS = {
  basico: ["Básico", "Basic"], electronica: ["Electrónica", "Electronic"], voces: ["Voces", "Voices"],
  clasica: ["Clásica", "Classical"], rock: ["Rock", "Rock"], espanola: ["Guitarra española", "Spanish guitar"],
  latina: ["Latina", "Latin"], urbano: ["Urbano", "Urban"],
};
// Slots that play notes in each pack (they show their note, 1 to 8, as in the app).
const NOTE_SLOTS = { basico: [5], electronica: [5], voces: [3, 4, 5], clasica: [0, 1, 2, 3, 4, 5],
                     rock: [4, 5], espanola: [1, 4, 5], latina: [], urbano: [5] };

async function decode(code) {
  const b64 = code.replace(/-/g, "+").replace(/_/g, "/");
  const bin = atob(b64 + "=".repeat((4 - b64.length % 4) % 4));
  const bytes = Uint8Array.from(bin, ch => ch.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return JSON.parse(await new Response(stream).text());
}

function clean(json) {
  const rings = (Array.isArray(json.rings) ? json.rings : []).slice(0, 5).map((ring, i) =>
    (Array.isArray(ring) ? ring : []).filter(h => h && isFinite(h.f) && h.s >= 0 && h.s < 6)
      .map((h, j) => ({ id: i * 1000 + j, f: ((h.f % 1) + 1) % 1, slot: h.s | 0, note: Math.min(7, Math.max(0, h.n | 0)) })));
  if (!rings.length) rings.push([]);
  const bpm = Math.min(180, Math.max(60, json.bpm | 0 || 96));
  const grid = [0, 8, 12, 16, 32].includes(json.grid) ? json.grid : 16;
  const pack = PACKS[json.pack] ? json.pack : "basico";
  const name = typeof json.name === "string" ? json.name.trim().slice(0, 40) : "";
  return { rings, bpm, grid, pack, name };
}

// ---------------------------------------------------------------- the board (Board.kt)
const TAU = Math.PI * 2, CORE = 0.085, OUTER = 0.45;
const SLOTS = ["#F2A65E", "#FF7D93", "#9DF0C4", "#B6A2FF", "#FFD36E", "#7FE3F0"];
const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const S = canvas.width, D = S / 360; // the board is about 360 dp wide on a phone
const dp = x => x * D;
const ringRadius = (i, n) => CORE + (OUTER - CORE) * (i + 1) / n;
const polar = (r, f) => [S / 2 + Math.cos(f * TAU - Math.PI / 2) * r, S / 2 + Math.sin(f * TAU - Math.PI / 2) * r];
const circle = (x, y, r) => { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU); };
const alpha = (hex, a) => hex + Math.round(Math.max(0, Math.min(1, a)) * 255).toString(16).padStart(2, "0");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

function draw(beat, phase, flashes, now, pulse) {
  const n = beat.rings.length, c = S / 2, core = S * CORE;
  const pr = Math.min(Math.max(S * 0.017, dp(5)), dp(10)), notePr = Math.max(pr, dp(7));
  const outer = ringRadius(n - 1, n) * S, theta = phase * TAU - Math.PI / 2;
  const flash = id => flashes.has(id) ? Math.exp(-(now - flashes.get(id)) / 0.2) : 0;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, S, S);
  ctx.setTransform(0.94, 0, 0, 0.94, S * 0.03, S * 0.03); // room for the glow of the outer points

  const g = ctx.createConicGradient(theta - 0.6, c, c);
  g.addColorStop(0, "rgba(255,255,255,0)");
  g.addColorStop(0.6 / TAU, "rgba(255,255,255,0.10)");
  g.addColorStop(0.6 / TAU + 1e-4, "rgba(255,255,255,0)");
  ctx.beginPath(); ctx.moveTo(c, c); ctx.arc(c, c, outer + dp(6), theta - 0.6, theta); ctx.closePath();
  ctx.fillStyle = g; ctx.fill();

  for (let i = 0; i < n; i++) {
    const r = ringRadius(i, n) * S;
    circle(c, c, r); ctx.strokeStyle = "rgba(170,178,200,0.32)"; ctx.lineWidth = dp(1.2); ctx.stroke();
    for (let j = 0; j < beat.grid; j++) {
      const onBeat = beat.grid % 4 === 0 && j % (beat.grid / 4) === 0;
      const p = polar(r, j / beat.grid);
      circle(p[0], p[1], onBeat ? dp(2) : dp(1.2));
      ctx.fillStyle = onBeat ? "rgba(210,216,234,0.6)" : "rgba(170,178,200,0.3)"; ctx.fill();
    }
  }
  beat.rings.forEach((ring, i) => {
    const r = ringRadius(i, n) * S;
    for (let slot = 0; slot < 6; slot++) {
      const hits = ring.filter(h => h.slot === slot).sort((a, b) => a.f - b.f);
      if (hits.length < 2) continue;
      let fl = 0;
      ctx.beginPath();
      hits.forEach((h, k) => { fl = Math.max(fl, flash(h.id)); const p = polar(r, h.f); k ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); });
      if (hits.length > 2) ctx.closePath();
      ctx.strokeStyle = alpha(SLOTS[slot], 0.5 + 0.45 * fl); ctx.lineWidth = (1.4 + 1.4 * fl) * D; ctx.lineJoin = "round"; ctx.stroke();
    }
  });

  const barW = Math.max(dp(2), S * 0.0065), dir = [Math.cos(theta), Math.sin(theta)];
  ctx.lineCap = "round";
  for (const [col, w] of [["rgba(255,255,255,0.12)", barW * 4], ["#F5F7FC", barW]]) {
    ctx.beginPath(); ctx.moveTo(c + dir[0] * core * 1.1, c + dir[1] * core * 1.1);
    ctx.lineTo(c + dir[0] * (outer + dp(10)), c + dir[1] * (outer + dp(10)));
    ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke();
  }

  const noteSlots = NOTE_SLOTS[beat.pack];
  beat.rings.forEach((ring, i) => {
    const r = ringRadius(i, n) * S;
    for (const h of ring) {
      const fl = flash(h.id), p = polar(r, h.f), hasNote = noteSlots.includes(h.slot);
      const rad = (hasNote ? notePr : pr) * (1 + 0.5 * fl), halo = rad * (2.4 + 2.6 * fl);
      const rg = ctx.createRadialGradient(p[0], p[1], 0, p[0], p[1], halo);
      rg.addColorStop(0, alpha(SLOTS[h.slot], 0.4 + 0.5 * fl)); rg.addColorStop(1, alpha(SLOTS[h.slot], 0));
      circle(p[0], p[1], halo); ctx.fillStyle = rg; ctx.fill();
      circle(p[0], p[1], rad); ctx.fillStyle = SLOTS[h.slot]; ctx.fill();
      if (fl > 0.01) { circle(p[0], p[1], rad); ctx.fillStyle = `rgba(255,255,255,${0.8 * fl})`; ctx.fill(); }
      if (hasNote) {
        ctx.fillStyle = "rgba(16,32,42,0.94)"; ctx.font = `500 ${rad * 1.45}px ui-monospace, Menlo, monospace`;
        ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(String(h.note + 1), p[0], p[1] + rad * 0.05);
      }
    }
  });

  const sp = core * (1 + 0.07 * Math.min(1, pulse));
  const gg = ctx.createRadialGradient(c, c, 0, c, c, sp * 2.3);
  gg.addColorStop(0, `rgba(242,166,94,${0.26 + 0.3 * Math.min(1, pulse)})`); gg.addColorStop(1, "rgba(242,166,94,0)");
  circle(c, c, sp * 2.3); ctx.fillStyle = gg; ctx.fill();
  const bg = ctx.createRadialGradient(c - sp * 0.3, c - sp * 0.35, 0, c - sp * 0.3, c - sp * 0.35, sp * 1.35);
  bg.addColorStop(0, "#FFE3B8"); bg.addColorStop(0.45, "#E39A52"); bg.addColorStop(1, "#6E421E");
  circle(c, c, sp); ctx.fillStyle = bg; ctx.fill();
  circle(c, c, sp * 1.18); ctx.strokeStyle = "rgba(255,205,150,0.5)"; ctx.lineWidth = dp(1); ctx.stroke();
}

function animate(beat) {
  const period = 240 / beat.bpm, flashes = new Map(), start = performance.now() / 1000;
  let last = -1, pulse = 0, lastT = start;
  const frame = ms => {
    const t = ms / 1000, phase = ((t - start) / period) % 1;
    if (last >= 0) {
      const crossed = f => last <= phase ? f > last && f <= phase : f > last || f <= phase;
      for (const ring of beat.rings) for (const h of ring) if (crossed(h.f)) { flashes.set(h.id, t); pulse += h.slot === 0 ? 1 : 0.3; }
    }
    pulse = Math.min(1.2, pulse) * Math.exp(-(t - lastT) / 0.16);
    last = phase; lastT = t;
    draw(beat, phase, flashes, t, pulse);
    requestAnimationFrame(frame);
  };
  if (reduceMotion) draw(beat, 0, flashes, start, 0); else requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- page
const $ = id => document.getElementById(id);
$("store").textContent = T.store;
canvas.setAttribute("aria-label", T.board);

(async () => {
  const code = location.hash.slice(1);
  let beat = null;
  try { if (code) beat = clean(await decode(code)); } catch (e) { beat = null; }
  if (!beat) {
    $("title").textContent = T.bad;
    $("note").textContent = T.badNote + " " + T.note;
    canvas.hidden = true;
    return;
  }
  document.title = "beatPi · " + (beat.name || T.untitled);
  $("title").textContent = beat.name || T.untitled;
  const hits = beat.rings.reduce((n, r) => n + r.length, 0);
  $("meta").textContent = `${beat.bpm} BPM · ${PACKS[beat.pack][es ? 0 : 1]} · ${T.hits(hits)}`;
  // On Android, open the app; if it is not installed, Chrome goes to Google Play instead.
  // Tablets (and phones set to "desktop site") send a Linux desktop user agent, so a Linux
  // browser with a touch screen counts as Android too.
  const ua = navigator.userAgent;
  const android = /android/i.test(ua) || navigator.userAgentData?.platform === "Android" ||
    (/linux/i.test(ua) && !/cros/i.test(ua) && navigator.maxTouchPoints > 0);
  $("note").textContent = (android ? T.listen : T.elsewhere) + " " + T.note;
  if (android) {
    const open = $("open");
    open.textContent = T.open;
    // Opera does not understand intent:// links, so it gets the app's own beatpi:// link
    // (without the jump to Google Play when the app is missing).
    const opera = /\bOP[RXT]\/|Opera/.test(ua);
    open.href = opera ? `beatpi://b/?c=${code}`
      : `intent://beatpiapp.github.io/beatpi-web/b/?c=${code}#Intent;scheme=https;package=com.beatpi.app;end`;
    open.hidden = false;
  }
  animate(beat);
})();
</script>
</body>
</html>
